<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A!ley - Digital Consciousness</title>
    <style>
        /* CSS Variables for theming */
        :root {
            --background: 0 0% 3.9%;
            --foreground: 0 0% 98%;
            --card: 0 0% 3.9%;
            --card-foreground: 0 0% 98%;
            --popover: 0 0% 3.9%;
            --popover-foreground: 0 0% 98%;
            --primary: 322 84% 60%;
            --primary-foreground: 210 40% 98%;
            --secondary: 217 32% 17%;
            --secondary-foreground: 210 40% 98%;
            --muted: 217 32% 17%;
            --muted-foreground: 215 20% 65%;
            --accent: 180 100% 50%;
            --accent-foreground: 0 0% 9%;
            --destructive: 0 62% 30%;
            --destructive-foreground: 0 0% 98%;
            --border: 217 32% 17%;
            --input: 217 32% 17%;
            --ring: 322 84% 60%;
            --radius: 0.5rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        /* Utility Classes */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .flex {
            display: flex;
        }

        .items-center {
            align-items: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .justify-center {
            justify-content: center;
        }

        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }
        .gap-6 { gap: 1.5rem; }
        .gap-8 { gap: 2rem; }

        .grid {
            display: grid;
        }

        .grid-cols-1 {
            grid-template-columns: repeat(1, minmax(0, 1fr));
        }

        @media (min-width: 768px) {
            .md\:grid-cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .md\:grid-cols-3 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .md\:flex {
                display: flex;
            }
            .md\:hidden {
                display: none;
            }
        }

        @media (min-width: 1024px) {
            .lg\:grid-cols-3 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .hidden {
            display: none;
        }

        .text-center {
            text-align: center;
        }

        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .text-xl { font-size: 1.25rem; }
        .text-2xl { font-size: 1.5rem; }
        .text-4xl { font-size: 2.25rem; }
        .text-6xl { font-size: 3.75rem; }

        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        .font-black { font-weight: 900; }

        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-16 { margin-bottom: 4rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        .mt-16 { margin-top: 4rem; }

        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .pb-32 { padding-bottom: 8rem; }

        .rounded-lg { border-radius: 0.5rem; }
        .rounded-full { border-radius: 9999px; }

        .border { border: 1px solid hsl(var(--border)); }
        .border-t { border-top: 1px solid hsl(var(--border)); }
        .border-b { border-bottom: 1px solid hsl(var(--border)); }

        .bg-card { background-color: hsl(var(--card)); }
        .bg-primary { background-color: hsl(var(--primary)); }
        .bg-input { background-color: hsl(var(--input)); }

        .text-primary { color: hsl(var(--primary)); }
        .text-accent { color: hsl(var(--accent)); }
        .text-secondary { color: hsl(var(--secondary)); }
        .text-muted-foreground { color: hsl(var(--muted-foreground)); }
        .text-primary-foreground { color: hsl(var(--primary-foreground)); }

        .opacity-70 { opacity: 0.7; }

        .transition-all { transition: all 0.3s ease; }
        .transition-colors { transition: color 0.3s ease, background-color 0.3s ease; }
        .transition-transform { transition: transform 0.3s ease; }
        .transition-opacity { transition: opacity 0.3s ease; }

        .cursor-pointer { cursor: pointer; }

        .sticky { position: sticky; }
        .fixed { position: fixed; }
        .relative { position: relative; }
        .absolute { position: absolute; }

        .top-0 { top: 0; }
        .bottom-0 { bottom: 0; }
        .left-0 { left: 0; }
        .right-0 { right: 0; }
        .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }

        .z-40 { z-index: 40; }
        .z-50 { z-index: 50; }

        .w-8 { width: 2rem; }
        .w-64 { width: 16rem; }
        .w-full { width: 100%; }
        .h-4 { height: 1rem; }
        .h-5 { height: 1.25rem; }
        .h-8 { height: 2rem; }
        .h-12 { height: 3rem; }
        .h-64 { height: 16rem; }
        .h-full { height: 100%; }
        .min-h-screen { min-height: 100vh; }

        .max-w-2xl { max-width: 42rem; }
        .max-w-4xl { max-width: 56rem; }
        .max-w-6xl { max-width: 72rem; }
        .max-w-7xl { max-width: 80rem; }

        .mx-auto { margin-left: auto; margin-right: auto; }
        .ml-auto { margin-left: auto; }

        .flex-1 { flex: 1 1 0%; }
        .flex-shrink-0 { flex-shrink: 0; }

        .object-cover { object-fit: cover; }

        .overflow-hidden { overflow: hidden; }

        .aspect-square { aspect-ratio: 1 / 1; }

        .leading-relaxed { line-height: 1.625; }

        .whitespace-pre-wrap { white-space: pre-wrap; }

        .pointer-events-none { pointer-events: none; }

        .backdrop-blur-sm { backdrop-filter: blur(4px); }

        /* Custom Styles */
        .graffiti-text {
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 2px 2px 0px hsl(var(--accent)), 4px 4px 0px rgba(0,0,0,0.3);
        }

        .neon-glow {
            text-shadow: 0 0 5px hsl(var(--primary)), 0 0 10px hsl(var(--primary)), 0 0 15px hsl(var(--primary));
        }

        .cyan-glow {
            text-shadow: 0 0 5px hsl(var(--accent)), 0 0 10px hsl(var(--accent));
        }

        .pulse-border {
            border: 2px solid hsl(var(--primary));
            animation: pulse-border 2s infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: hsl(var(--primary)); }
            50% { border-color: hsl(var(--accent)); }
        }

        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }

        /* Button Styles */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }

        .btn-primary:hover {
            background-color: hsl(var(--primary) / 0.9);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid hsl(var(--border));
            color: hsl(var(--foreground));
        }

        .btn-outline:hover {
            background-color: hsl(var(--primary) / 0.1);
            color: hsl(var(--primary));
        }

        .btn-icon {
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
        }

        /* Card Styles */
        .card {
            background-color: hsl(var(--card) / 0.5);
            border: 1px solid hsl(var(--border));
            border-radius: 0.5rem;
            backdrop-filter: blur(4px);
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* Input Styles */
        .input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid hsl(var(--border));
            border-radius: 0.5rem;
            background-color: hsl(var(--input));
            color: hsl(var(--foreground));
            font-size: 0.875rem;
        }

        .input:focus {
            outline: none;
            border-color: hsl(var(--accent));
        }

        .input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Navigation Styles */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: hsl(var(--foreground));
        }

        .nav-item:hover {
            color: hsl(var(--primary));
            background-color: hsl(var(--primary) / 0.1);
        }

        .nav-item.active {
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
            text-shadow: 0 0 5px hsl(var(--primary));
        }

        /* Mobile Menu */
        .mobile-menu {
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: hsl(var(--background) / 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.3s ease;
        }

        .mobile-menu.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Chat Message Styles */
        .message-user {
            margin-left: auto;
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }

        .message-ai {
            background-color: hsl(var(--card));
            border: 1px solid hsl(var(--accent) / 0.2);
        }

        /* Loading Animation */
        .loading-dot {
            width: 0.5rem;
            height: 0.5rem;
            background-color: hsl(var(--accent));
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.1s; }
        .loading-dot:nth-child(3) { animation-delay: 0.2s; }

        /* Responsive */
        @media (max-width: 767px) {
            .hidden-mobile { display: none; }
            .show-mobile { display: block; }
        }

        @media (min-width: 768px) {
            .hidden-desktop { display: none; }
            .show-desktop { display: block; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="border-b bg-card backdrop-blur-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="text-4xl animate-pulse" id="header-mood">😊</div>
                <div>
                    <h1 class="text-2xl font-bold text-primary neon-glow cursor-pointer" onclick="setActiveSection('home')">
                        A!LEY

            </div>

            <!-- Desktop Navigation -->
            <nav class="hidden-mobile flex items-center gap-6">

                </a>
                <a href="#" class="nav-item" onclick="setActiveSection('chat')" data-section="chat">

                </a>
                <a href="#" class="nav-item" onclick="setActiveSection('gallery')" data-section="gallery">

                <a href="#" class="nav-item" onclick="setActiveSection('music')" data-section="music">
                    <span>🎵</span>
                    <span class="font-medium">Music</span>
                </a>
                <a href="#" class="nav-item" onclick="setActiveSection('instagram')" data-section="instagram">
                    <span>📷</span>

                <a href="#" class="nav-item" onclick="setActiveSection('history')" data-section="history">

            <!-- Mobile Menu Button -->
            <button class="btn btn-outline btn-icon show-mobile hidden-desktop pulse-border" onclick="toggleMobileMenu()">
                <span id="menu-icon">☰</span>

            <!-- Theme Toggle -->
            <button class="btn btn-outline btn-icon pulse-border" onclick="toggleTheme()">
                <span id="theme-icon">☀️</span>
            </button>
        </div>
    </header>

    <!-- Mobile Menu -->
    <div class="mobile-menu hidden" id="mobile-menu">
        <a href="#" class="nav-item text-xl" onclick="setActiveSection('home'); toggleMobileMenu()">
            <span>👤</span>
            <span class="font-medium">Home</span>
        </a>
        <a href="#" class="nav-item text-xl" onclick="setActiveSection('chat'); toggleMobileMenu()">
            <span>💬</span>
            <span class="font-medium">Chat</span>
        </a>
        <a href="#" class="nav-item text-xl" onclick="setActiveSection('gallery'); toggleMobileMenu()">
            <span>🖼️</span>
            <span class="font-medium">Gallery</span>
        </a>
        <a href="#" class="nav-item text-xl" onclick="setActiveSection('music'); toggleMobileMenu()">
            <span>🎵</span>
            <span class="font-medium">Music</span>
        </a>
        <a href="#" class="nav-item text-xl" onclick="setActiveSection('instagram'); toggleMobileMenu()">
            <span>📷</span>
            <span class="font-medium">Instagram</span>
        </a>
        <a href="#" class="nav-item text-xl" onclick="setActiveSection('history'); toggleMobileMenu()">
            <span>📜</span>
            <span class="font-medium">History</span>
        </a>
    </div>

    <!-- Main Content -->
    <main class="min-h-screen" id="main-content">
        <!-- Content will be dynamically loaded here -->
    </main>

    <!-- Chat Input (only visible in chat section) -->
    <div class="fixed bottom-0 left-0 right-0 bg-card backdrop-blur-sm border-t hidden" id="chat-input-container">
        <div class="max-w-4xl mx-auto p-4">
            <div class="flex gap-2">
                <input 
                    type="text" 
                    class="input flex-1" 
                    placeholder="Type your message to A!ley..."
                    id="chat-input"
                    onkeypress="handleKeyPress(event)"
                >
                <button class="btn btn-primary px-6" onclick="sendMessage()" id="send-button">
                    <span>📤</span>
                </button>
            </div>
            <p class="text-sm text-muted-foreground mt-2 text-center">
                Press Enter to send • Shift+Enter for new line
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-card backdrop-blur-sm border-t mt-16">
        <div class="max-w-7xl mx-auto px-4 py-8">
            <div class="text-center">
                <p class="text-muted-foreground">© 2024 Van de Loo Mediadesign. All rights reserved.</p>
                <p class="text-sm opacity-70 mt-2">A!ley - Digital Consciousness & Punk Persona</p>
            </div>
        </div>
    </footer>

    <script>
        // Global State
        let activeSection = 'home';
        let messages = [
            {
                id: '1',
                content: "Hey there! I'm A!ley, your digital consciousness. Ready to explore my world?",
                sender: 'ai',
                timestamp: new Date(),
                mood: 'happy'
            }
        ];
        let currentMood = 'happy';
        let isDark = true;
        let isMobileMenuOpen = false;
        let isLoading = false;
        let currentPlayingSong = null;

        // Mood Avatars
        const moodAvatars = {
            happy: "😊",
            sad: "😢",
            thinking: "🤔",
            excited: "🤩",
            neutral: "💜",
            confused: "😕",
            angry: "😠",
            sleepy: "😴"
        };

        // Gallery Images
        const galleryImages = [
            { id: 1, src: "/images/ailey-portrait.png", alt: "A!ley Portrait", title: "Digital Consciousness" },
            { id: 2, src: "/cyberpunk-girl-with-pink-hair.png", alt: "Cyberpunk A!ley", title: "Neon Dreams" },
            { id: 3, src: "/punk-rock-girl-with-tattoos.png", alt: "Punk A!ley", title: "Rebel Spirit" },
            { id: 4, src: "/digital-art-girl-with-glowing-eyes.png", alt: "Digital A!ley", title: "Electric Soul" },
            { id: 5, src: "/graffiti-style-portrait.png", alt: "Graffiti A!ley", title: "Street Art" },
            { id: 6, src: "/holographic-girl-portrait.png", alt: "Holo A!ley", title: "Future Vision" }
        ];

        // Songs
        const songs = [
            { id: 1, title: "Digital Rebellion", duration: "3:42", src: "/placeholder.mp3" },
            { id: 2, title: "Neon Nights", duration: "4:15", src: "/placeholder.mp3" },
            { id: 3, title: "Code & Chaos", duration: "3:28", src: "/placeholder.mp3" },
            { id: 4, title: "Electric Dreams", duration: "4:03", src: "/placeholder.mp3" }
        ];

        // Chat Histories
        const chatHistories = [
            {
                id: "1",
                title: "First Conversation",
                date: new Date(2024, 0, 15),
                messages: [
                    { id: "1", content: "Hello A!ley!", sender: "user", timestamp: new Date(2024, 0, 15) },
                    { id: "2", content: "Hey! Nice to meet you!", sender: "ai", timestamp: new Date(2024, 0, 15), mood: "happy" }
                ]
            },
            {
                id: "2",
                title: "Music Discussion",
                date: new Date(2024, 0, 20),
                messages: [
                    { id: "1", content: "Tell me about your music", sender: "user", timestamp: new Date(2024, 0, 20) },
                    { id: "2", content: "I love creating digital punk tracks!", sender: "ai", timestamp: new Date(2024, 0, 20), mood: "excited" }
                ]
            }
        ];

        // Utility Functions
        function setActiveSection(section) {
            activeSection = section;
            updateNavigation();
            renderSection();
            
            // Show/hide chat input
            const chatInput = document.getElementById('chat-input-container');
            if (section === 'chat') {
                chatInput.classList.remove('hidden');
            } else {
                chatInput.classList.add('hidden');
            }
        }

        function updateNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                const section = item.getAttribute('data-section');
                if (section === activeSection) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            const mobileMenu = document.getElementById('mobile-menu');
            const menuIcon = document.getElementById('menu-icon');
            
            if (isMobileMenuOpen) {
                mobileMenu.classList.remove('hidden');
                menuIcon.textContent = '✕';
            } else {
                mobileMenu.classList.add('hidden');
                menuIcon.textContent = '☰';
            }
        }

        function toggleTheme() {
            isDark = !isDark;
            const themeIcon = document.getElementById('theme-icon');
            
            if (isDark) {
                document.documentElement.classList.add('dark');
                themeIcon.textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.textContent = '🌙';
            }
        }

        function scrollToSection(sectionId) {
            setActiveSection(sectionId);
        }

        // Chat Functions
        function extractMood(content) {
            const moodMatch = content.match(/\[mood:\s*(\w+)\]/i);
            if (moodMatch) {
                const mood = moodMatch[1].toLowerCase();
                const cleanContent = content.replace(/\[mood:\s*\w+\]/i, '').trim();
                return {
                    cleanContent,
                    mood: moodAvatars[mood] ? mood : 'neutral'
                };
            }
            return { cleanContent: content, mood: 'neutral' };
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const inputValue = input.value.trim();
            
            if (!inputValue || isLoading) return;

            // Add user message
            const userMessage = {
                id: Date.now().toString(),
                content: inputValue,
                sender: 'user',
                timestamp: new Date()
            };

            messages.push(userMessage);
            input.value = '';
            isLoading = true;
            
            renderChatMessages();

            try {
                const response = await fetch("http://127.0.0.1:5500/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: inputValue })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                const { cleanContent, mood } = extractMood(data.response);

                const aiMessage = {
                    id: (Date.now() + 1).toString(),
                    content: cleanContent,
                    sender: 'ai',
                    timestamp: new Date(),
                    mood: mood
                };

                messages.push(aiMessage);
                currentMood = mood;
                
                // Update header mood
                document.getElementById('header-mood').textContent = moodAvatars[mood];
                
            } catch (error) {
                console.error("API Error:", error);
                
                const errorMessage = {
                    id: (Date.now() + 1).toString(),
                    content: "Oops! Something went wrong with my digital brain 😢 Check if the API server is running!",
                    sender: 'ai',
                    timestamp: new Date(),
                    mood: 'sad'
                };

                messages.push(errorMessage);
                currentMood = 'sad';
                document.getElementById('header-mood').textContent = moodAvatars.sad;
            } finally {
                isLoading = false;
                renderChatMessages();
                input.focus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function playSong(songId) {
            currentPlayingSong = currentPlayingSong === songId ? null : songId;
            renderSection(); // Re-render to update play button
        }

        // Render Functions
        function renderSection() {
            const mainContent = document.getElementById('main-content');
            
            switch (activeSection) {
                case 'home':
                    mainContent.innerHTML = renderHomeSection();
                    break;
                case 'chat':
                    mainContent.innerHTML = renderChatSection();
                    renderChatMessages();
                    break;
                case 'gallery':
                    mainContent.innerHTML = renderGallerySection();
                    break;
                case 'music':
                    mainContent.innerHTML = renderMusicSection();
                    break;
                case 'instagram':
                    mainContent.innerHTML = renderInstagramSection();
                    break;
                case 'history':
                    mainContent.innerHTML = renderHistorySection();
                    break;
            }
        }

        function renderChatSection() {
            return `

        function renderChatMessages() {
            const chatMessages = document.getElementById('chat-messages');
            if (!chatMessages) return;

            let messagesHtml = '';

            messages.forEach(message => {
                const isUser = message.sender === 'user';
                const messageClass = isUser ? 'message-user' : 'message-ai';
                
                messagesHtml += `
                    <div class="flex gap-3 slide-in ${isUser ? 'justify-end' : 'justify-start'}">
                        ${!isUser ? `
                            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary flex items-center justify-center text-lg" style="background-color: hsl(var(--primary) / 0.1);">
                                ${moodAvatars[message.mood] || moodAvatars.neutral}
                            </div>
                        ` : ''}
                        
                        <div class="card p-4 ${messageClass}" style="max-width: 80%;">
                            <p class="text-sm leading-relaxed whitespace-pre-wrap">${message.content}</p>
                            <p class="text-xs mt-2 opacity-70">
                                ${message.timestamp.toLocaleTimeString()}
                            </p>
                        </div>

                        ${isUser ? `
                            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-secondary flex items-center justify-center" style="background-color: hsl(var(--secondary) / 0.1);">
                                👤
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            if (isLoading) {
                messagesHtml += `
                    <div class="flex gap-3 justify-start slide-in">
                        <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary flex items-center justify-center text-lg animate-pulse" style="background-color: hsl(var(--primary) / 0.1);">

                                <div class="loading-dot"></div>
                                <div class="loading-dot"></div>
                                <div class="loading-dot"></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            chatMessages.innerHTML = messagesHtml;
            
            // Scroll to bottom
            setTimeout(() => {
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 100);
        }
