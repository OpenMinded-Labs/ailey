[package]
name = "ailey"
version = "3.0.0"
description = "Ailey AI Desktop App"
authors = ["Simon van de Loo"]
license = "MIT"
repository = "https://github.com/CaptainShagggy/Ailey-2.0-Core"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.9.1", features = [] }
libc = "0.2"
tauri-plugin-shell = "2.2.0"
